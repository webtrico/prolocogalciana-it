name = "emd-prolocogalciana-it"
main = "src/index.ts"
compatibility_date = "2025-04-01"
workers_dev = true

[observability]
enabled = true

[assets]
directory = "./static"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = true

[vars]
COUNTRY = "IT"
TOPLIST_EDGE = "https://toplist-edge.webtrico.com"
TOPLIST_ADMIN = "https://toplist-admin.webtrico.com"

[[routes]]
pattern = "prolocogalciana.it/*"
zone_id = "cf09f430484d5e6e2b01c4e1a8105170"

[[routes]]
pattern = "www.prolocogalciana.it/*"
zone_id = "cf09f430484d5e6e2b01c4e1a8105170"
